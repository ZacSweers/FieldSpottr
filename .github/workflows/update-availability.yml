name: Update availability

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/bbp/**'
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-availability
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FIELDSPOTTR_BOT_TOKEN }}

      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Kernel CLI
        run: npm install --global @onkernel/cli@0.26.0

      - name: Test availability updater
        run: scripts/update-availability-test.sh

      - name: Update availability data
        env:
          FETCH_BACKEND: kernel
          KERNEL_API_KEY: ${{ secrets.KERNEL_API_KEY }}
          REQUIRE_FRESH_LIVE_SOURCES: 'true'
        run: scripts/update-availability.sh

      - name: Write generated data diff
        id: diff
        run: |
          mkdir -p build/availability-diff
          git status --short -- areas.json availability > build/availability-diff/status.txt

          if [ ! -s build/availability-diff/status.txt ]; then
            echo "No availability changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add --intent-to-add areas.json availability
          git diff --stat -- areas.json availability > build/availability-diff/diff.stat
          git diff --binary -- areas.json availability > build/availability-diff/availability.patch
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated data
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          branch="automation/update-availability-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add areas.json availability
          git commit -m "Update availability data"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FIELDSPOTTR_BOT_TOKEN }}
        run: |
          pr_url="$(
            gh pr create \
              --base main \
              --head "${{ steps.commit.outputs.branch }}" \
              --title "Update availability data" \
              --body "Automated availability data refresh."
          )"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.FIELDSPOTTR_BOT_TOKEN }}
        run: gh pr merge --auto --squash --delete-branch "${{ steps.pr.outputs.url }}"

      - name: (Fail-only) Upload generated data
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: availability-debug
          path: |
            areas.json
            availability/**
            build/hrp/**
            build/nyc-live/**
            generator/build/reports/**

      - name: Upload generated data diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: availability-diff
          if-no-files-found: ignore
          path: build/availability-diff/**
